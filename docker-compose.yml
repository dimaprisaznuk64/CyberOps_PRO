name: cyberops

x-notify-environment: &notify-environment
  NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  NOTIFY_MIN_SEVERITY: ${NOTIFY_MIN_SEVERITY:-high}
  SMTP_ENABLED: ${SMTP_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-cyberops@localhost}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CyberOps PRO}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMTP_SSL: ${SMTP_SSL:-false}
  TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}

x-backend-service: &backend-service
  image: ${IMAGE_PREFIX:-cyberops}/cyberops-backend:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-environment
    APP_ENV: dev
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberops}:${POSTGRES_PASSWORD:-cyberops}@postgres:5432/${POSTGRES_DB:-cyberops}
    CELERY_BROKER_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
    REALTIME_MODE: ${REALTIME_MODE:-redis}
    SCAN_ALLOW_PUBLIC: ${SCAN_ALLOW_PUBLIC:-false}
    # Ліміт сирого Nmap-XML у JSON-відповіді архіву (понад — лише .xml)
    SCAN_RAW_XML_MAX_CHARS: ${SCAN_RAW_XML_MAX_CHARS:-400000}
    JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-before-production}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    CORS_ORIGINS: ${CORS_ORIGINS:-*}
    # Tracing: OTLP-колектор — це jaeger у compose мережі. Локальний запуск
    # поза compose має власний OTLP_ENDPOINT (за замовчуванням localhost:4318).
    TRACING_ENABLED: ${TRACING_ENABLED:-true}
    OTLP_ENDPOINT: ${OTLP_ENDPOINT_INTERNAL:-http://jaeger:4318/v1/traces}
    <<: *notify-environment

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberops}
      POSTGRES_DB: ${POSTGRES_DB:-cyberops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    <<: *backend-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    # Jaeger групує спани за service.name — кожен сервіс називає себе сам
    environment:
      <<: *backend-environment
      TRACING_SERVICE_NAME: core
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth:
    <<: *backend-service
    command: uvicorn app.auth_app:app --host 0.0.0.0 --port 8002
    environment:
      <<: *backend-environment
      TRACING_SERVICE_NAME: auth
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    image: ${IMAGE_PREFIX:-cyberops}/cyberops-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      AUTH_SERVICE_URL: http://auth:8002
      CORE_SERVICE_URL: http://core:8001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-before-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-5}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      HSTS_ENABLED: ${HSTS_ENABLED:-true}
      # TLS на gateway вмикається цими змінними (сертифікат монтується в /certs).
      # За замовчуванням gateway слухає HTTP — TLS термінує балансувальник.
      GATEWAY_TLS_CERTFILE: ${GATEWAY_TLS_CERTFILE:-}
      GATEWAY_TLS_KEYFILE: ${GATEWAY_TLS_KEYFILE:-}
      # v1.3: gateway теж експортує спани, щоб перший хоп (клієнт -> gateway
      # -> core) був видимий, а не починався десь у core.
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      TRACING_SERVICE_NAME: gateway
    volumes:
      - ${TLS_CERTS_DIR:-./certs}:/certs:ro
    ports:
      - "8000:8000"
    depends_on:
      core:
        condition: service_healthy
      auth:
        condition: service_healthy

  worker:
    image: ${IMAGE_PREFIX:-cyberops}/cyberops-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberops}:${POSTGRES_PASSWORD:-cyberops}@postgres:5432/${POSTGRES_DB:-cyberops}
      CELERY_BROKER_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
      REALTIME_MODE: ${REALTIME_MODE:-redis}
      SCAN_ALLOW_PUBLIC: ${SCAN_ALLOW_PUBLIC:-false}
      NMAP_TIMEOUT_SECONDS: ${NMAP_TIMEOUT_SECONDS:-300}
      SCAN_STALE_AFTER_SECONDS: ${SCAN_STALE_AFTER_SECONDS:-900}
      SCAN_REAPER_INTERVAL_SECONDS: ${SCAN_REAPER_INTERVAL_SECONDS:-60}
      # Воркер теж експортує спани (scan.run тощо), інакше довгі сканування
      # не видно в Jaeger — найцікавіші сліди саме звідти
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_SERVICE_NAME: worker
      OTLP_ENDPOINT: ${OTLP_ENDPOINT_INTERNAL:-http://jaeger:4318/v1/traces}
      <<: *notify-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX:-cyberops}/cyberops-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_started

  # Jaeger all-in-one: приймає OTLP/HTTP і показує спани.
  # UI на http://localhost:16686, OTLP на 4318 (зсередини мережі — jaeger:4318).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP (для otel-продуктів поза compose)
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # Локальний SMTP-стенд для тестування email-каналу без зовнішніх серверів.
  # Увімкнути: docker compose --profile mail up -d
  # Пошта на http://localhost:8025, SMTP на localhost:1025
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: