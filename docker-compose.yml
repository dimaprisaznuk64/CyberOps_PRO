x-backend-service: &backend-service
  image: ${IMAGE_PREFIX:-cyberops}/cyberops-backend:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-environment
    APP_ENV: dev
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberops}:${POSTGRES_PASSWORD:-cyberops}@postgres:5432/${POSTGRES_DB:-cyberops}
    CELERY_BROKER_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
    REALTIME_MODE: ${REALTIME_MODE:-redis}
    SCAN_ALLOW_PUBLIC: ${SCAN_ALLOW_PUBLIC:-false}
    JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    CORS_ORIGINS: ${CORS_ORIGINS:-*}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberops}
      POSTGRES_DB: ${POSTGRES_DB:-cyberops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    <<: *backend-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth:
    <<: *backend-service
    command: uvicorn app.auth_app:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    image: ${IMAGE_PREFIX:-cyberops}/cyberops-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      AUTH_SERVICE_URL: http://auth:8002
      CORE_SERVICE_URL: http://core:8001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      core:
        condition: service_healthy
      auth:
        condition: service_healthy

  worker:
    image: ${IMAGE_PREFIX:-cyberops}/cyberops-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberops}:${POSTGRES_PASSWORD:-cyberops}@postgres:5432/${POSTGRES_DB:-cyberops}
      CELERY_BROKER_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
      REALTIME_MODE: ${REALTIME_MODE:-redis}
      SCAN_ALLOW_PUBLIC: ${SCAN_ALLOW_PUBLIC:-false}
      NMAP_TIMEOUT_SECONDS: ${NMAP_TIMEOUT_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata: