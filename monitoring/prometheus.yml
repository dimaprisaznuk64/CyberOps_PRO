global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cyberops
    static_configs:
      - targets: ["backend:8000"]
  - job_name: cyberops-worker
    static_configs:
      - targets: ["worker:9091"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]