target-version = "py313"
line-length = 100

# Один конфіг на весь репозиторій — і це не просто охайність (v1.25).
#
# Двічі був створений `backend/ruff.toml` з тим самим вмістом, що й цей
# (обидва — коміт 1635fe9). Ruff бере конфіг із першого знайденого каталогу
# вгору від файлу: для `backend/**` це `backend/ruff.toml`, для `gateway/**` —
# цей. Тобто два однакові за текстом файли давали різні `project_root`, а
# класифікація first-party спирається саме на нього:
#
#   * `ruff check .` з `backend/` → root = `backend`, тому `gateway` (../gateway)
#     і `workers` — сторонні пакети, а `app` — свій;
#   * gate у `ci.yml` — ті ж файли, але root = репозиторій, тому все first-party.
#
# `I001` (сортування імпортів) залежить від цієї класифікації, тож той самий
# `from gateway.main import ...` міг лежати серед сторонніх або серед своїх
# залежно від того, звільний запуск. Практично: `ruff check .` падав із 64
# помилками, а автофікс під ним робив gate зеленим на хибному групуванні —
# тобто «прибрали помилки» означало «переписали імпорти неправильно».
#
# Явний `src` робить класифікацію незалежною від cwd і набору аргументів.
src = ["backend", "gateway", "workers", "services"]

[lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
