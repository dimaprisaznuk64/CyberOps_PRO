name: Docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: img
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == "master" ]]; then
            TAG="dev"
          else
            TAG="${REF_NAME#v}"
          fi
          # GHCR вимагає lowercase в імені образу, а в github.repository
          # регістр зберігається (CyberOps_PRO). У виразах GitHub немає
          # функції lower() — лише bash.
          REGISTRY="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend (core + auth)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.registry }}/cyberops-backend:${{ steps.img.outputs.tag }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.registry }}/cyberops-worker:${{ steps.img.outputs.tag }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.registry }}/cyberops-gateway:${{ steps.img.outputs.tag }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          # Без NEXT_PUBLIC_API_URL свідомо: NEXT_PUBLIC_* вписується в
          # бандл назавжди, тож опублікований образ був би прив'язаний до
          # адреси, під якою його зібрали (тут — localhost:8000). Хтось,
          # хто візьме цей образ для свого стенду, отримає UI, який ходить
          # у localhost свого браузера — рівно той баг, що коштував v1.7
          # і v1.14. Адреса приходить у рантаймі через /runtime-config.js,
          # тож образ не прив'язаний до жодної.
          tags: ${{ steps.img.outputs.registry }}/cyberops-frontend:${{ steps.img.outputs.tag }}
