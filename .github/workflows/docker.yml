name: Docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: img
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == "master" ]]; then
            TAG="dev"
          else
            TAG="${REF_NAME#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${{ lower(github.repository) }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend (core + auth)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.registry }}/cyberops-backend:${{ steps.img.outputs.tag }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.registry }}/cyberops-worker:${{ steps.img.outputs.tag }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.registry }}/cyberops-gateway:${{ steps.img.outputs.tag }}