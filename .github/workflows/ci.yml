name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Перший пуш у нове репо не запускає воркфлою: файли з'являються в
  # гілці і той самий коміт їх тригерить, тож GitHub не встигає їх зареєструвати
  # (run падає за 0s з "workflow file issue"). workflow_dispatch дозволяє
  # перезапустити прогін вручну без фіктивного коміту.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff check
        # Корінь репозиторію, а не `backend/`: конфіг один (`ruff.toml` у корені)
        # і він має бачити всі пакети разом. Раніше gate запускався з `backend/`
        # з переліком аргументів, тож не перевіряв `scripts/` — де жив
        # `demo.py`, який ніхто не лінтував (v1.25).
        #
        # `.kilo/` — робочі копії агента всередині репозиторію, не наш код.
        run: python -m ruff check backend gateway workers services scripts --exclude .kilo

      - name: Tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Compose validation
        run: docker compose config -q

      - name: Compose validation (prod override)
        # Прод-override робить секрети обов'язковими (${VAR:?...}), тож для
        # валідації підставляємо фікстури: інакше CI падав би на compose
        # interpolation, а не на синтаксисі самого файлу.
        env:
          JWT_SECRET: ci-fixture-secret-value-not-used-anywhere-32
          POSTGRES_PASSWORD: ci-fixture
          ADMIN_PASSWORD: ci-fixture
          CORS_ORIGINS: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          GRAFANA_ADMIN_PASSWORD: ci-fixture
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Kubernetes manifests validation
        run: kubectl kustomize infrastructure/kubernetes/overlays/dev > /dev/null

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bandit (SAST)
        # -ll = medium і вище; нижчі (B105/B404) не блокують збірку
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -r backend/app backend/tests gateway workers services -ll

      - name: pip-audit (залежності з відомим CVE)
        # Обидва файли, а не лише backend: gateway — окремий сервіс із власними
        # залежностями (Starlette, websockets, opentelemetry), і вони довго не
        # сканувалися. Той самий `starlette` у backend тримався на 1.7.*, поки
        # gateway на 0.115 — тобто security-політика була нерівномірною, а
        # pip-audit бачив тільки половину проєкту.
        run: |
          pip install -r backend/requirements.txt -r gateway/requirements.txt pip-audit
          pip-audit -r backend/requirements.txt
          pip-audit -r gateway/requirements.txt

      - name: Trivy (CVE у залежностях)
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          # Пін на конкретну версію: у aquasecurity/trivy для v0.58.x та
          # старіших НЕМА релізів (лише теги), тож install-скрипт падає на
          # download. v0.70.0 — перша з реальним release.
          version: v0.70.0

      - name: Trivy scan
        # Раніше крок був continue-on-error, і це ховало не «поки що
        # нереалістично», а поломку: `--pkg-types python` у v0.70.0 не
        # існує (допустимі лише os|library), тож trivy падав із
        # "flag error: invalid argument [python]" і сканування не відбулося
        # НІ РАЗУ — від самого додавання кроку. Job був зелений, CVE
        # не перевірялися.
        #
        # `library` — мовні пакети (pip/npm), на відміну від `os`. Тут
        # покриття ширше за pip-audit: він дивиться лише на Python, а
        # Trivy бачить ще й залежності фронтенду.
        run: |
          trivy fs --scanners vuln --pkg-types library --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 .

      # Semgrep (SAST з правилами p/ci) тут БУВ і ніколи не запускався.
      #
      # Крок стояв під `if: env.SEMGREP_APP_TOKEN != ''`, а секрету в
      # репозиторії немає взагалі (`gh secret list` порожній). Тобто кожен
      # прогін мав `Semgrep: skipped` при зеленому job — ще одна перевірка,
      # яка ніколи не перевіряла нічого, поруч із тією, що тричі поспіль
      # ховалась у цьому ж проекті (v1.17 admin-порт, v1.18 E2D-стенд,
      # v1.19 Trivy на неіснуючому флагі).
      #
      # Прибрано, а не залишено «на потім»: краще відсутня перевірка, ніж
      # перевірка, яка створює враження, що SAST у бекенді є. Bandit нижче
      # запускається завжди і реально сканує ~4400 рядків.
      #
      # Щоб повернути Semgrep: створити бота, покласти SEMGREP_APP_TOKEN у
      # secrets і додати крок БЕЗ `if` — тоді невиконання падатиме, а не
      # мовчатиме.

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
