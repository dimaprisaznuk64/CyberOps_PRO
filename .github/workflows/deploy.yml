name: Deploy (kind)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  kind-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          # Імʼя кластера задаємо явно: дефолт у kind-action — chart-testing,
          # а kind load без --name дивиться у контекст "kind" і не знаходить
          # нічого ("no nodes found for cluster").
          cluster_name: cyberops
          kubectl_version: v1.29.3

      - name: Load images
        run: |
          kind load docker-image --name cyberops cyberops/cyberops-backend:latest
          kind load docker-image --name cyberops cyberops/cyberops-worker:latest
          kind load docker-image --name cyberops cyberops/cyberops-gateway:latest
          kind load docker-image --name cyberops cyberops/cyberops-frontend:latest

      - name: Validate kustomize build
        run: kubectl kustomize infrastructure/kubernetes/overlays/dev > /dev/null

      - name: Deploy manifests
        run: kubectl apply -k infrastructure/kubernetes/overlays/dev

      - name: Wait migrations
        run: kubectl -n cyberops wait --for=condition=complete job/migrations --timeout=240s

      - name: Wait rollouts
        run: |
          for d in postgres redis rabbitmq core auth gateway worker frontend prometheus grafana; do
            kubectl -n cyberops rollout status deployment/$d --timeout=240s
          done

      # Не просто «процеси піднялися». Старий крок робив один curl /health, тож
      # E2E був зелений на стенді, де UI не міг ані увійти, ані отримати
      # жодного запиту. Тут перевіряється поведінка, зокрема дві речі, які
      # curl не бачить у принципі:
      #   * runtime-конфіг — адреса API приходить у браузер, а не з бандлу;
      #   * CORS — запит із заголовком Origin, тобо так, як його робить браузер.
      - name: Smoke test (via gateway)
        run: |
          kubectl -n cyberops port-forward svc/gateway 8000:8000 &
          GW_PID=$!
          kubectl -n cyberops port-forward svc/frontend 3000:3000 &
          FE_PID=$!
          trap 'kill $GW_PID $FE_PID 2>/dev/null || true' EXIT
          sleep 3

          # Очікувані значення беремо з самої розгорнутої лози, а не з
          # констант тут: інакше тест підтверджував би себе самого і був би
          # зелений рівно тоді, коли змінна не доїде до контейнера.
          secret_get() { kubectl -n cyberops get secret cyberops-secrets -o jsonpath="{.data.$1}" | base64 -d; }
          FRONTEND_ORIGIN=$(kubectl -n cyberops get svc frontend -o jsonpath='{.spec.ports[0].nodePort}')

          export GATEWAY_URL=http://localhost:8000
          export FRONTEND_URL=http://localhost:3000
          export EXPECTED_API_URL="$(kubectl -n cyberops get configmap cyberops-config -o jsonpath='{.data.API_PUBLIC_URL}')"
          export EXPECTED_ORIGIN="http://localhost:$FRONTEND_ORIGIN"
          export ADMIN_USER="$(secret_get ADMIN_USERNAME)"
          export ADMIN_PASS="$(secret_get ADMIN_PASSWORD)"
          bash scripts/smoke.sh

      - name: Pods
        if: always()
        run: kubectl -n cyberops get pods -o wide

      # Діагностика падінь. Без неї крок вище показує лише симптом
      # (ImagePullBackOff / CrashLoopBackOff) і не пояснює його: логи контейнера
      # живуть у кластері, а не в лозі запуску, тож наступна сесія знову
      # вгадує причину. Крок коштує нічого — кластер уже видалено після нього.
      - name: Diagnostics
        if: always()
        run: |
          echo "=== events ==="
          kubectl -n cyberops get events --sort-by=.lastTimestamp | tail -40
          echo
          for p in $(kubectl -n cyberops get pods -o name); do
            echo "=== $p: describe ==="
            kubectl -n cyberops describe "$p" | sed -n '/^Events:/,$p'
            echo "=== $p: logs (previous) ==="
            kubectl -n cyberops logs "$p" --previous --tail=60 2>&1 || true
            echo "=== $p: logs (current) ==="
            kubectl -n cyberops logs "$p" --tail=40 2>&1 || true
            echo
          done