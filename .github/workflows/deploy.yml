name: Deploy (kind)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  kind-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          # Імʼя кластера задаємо явно: дефолт у kind-action — chart-testing,
          # а kind load без --name дивиться у контекст "kind" і не знаходить
          # нічого ("no nodes found for cluster").
          cluster_name: cyberops
          kubectl_version: v1.29.3

      - name: Load images
        run: |
          kind load docker-image --name cyberops cyberops/cyberops-backend:latest
          kind load docker-image --name cyberops cyberops/cyberops-worker:latest
          kind load docker-image --name cyberops cyberops/cyberops-gateway:latest
          kind load docker-image --name cyberops cyberops/cyberops-frontend:latest

      - name: Validate kustomize build
        run: kubectl kustomize infrastructure/kubernetes/overlays/dev > /dev/null

      - name: Deploy manifests
        run: kubectl apply -k infrastructure/kubernetes/overlays/dev

      - name: Wait migrations
        run: kubectl -n cyberops wait --for=condition=complete job/migrations --timeout=240s

      # Список деплойментів беремо з кластера, а не з константи тут. Раніше
      # jaeger був пропущений у цьому списку — тобто він міг не піднятися,
      # а E2E був зелений: OTLP-спани з усіх сервісів ішли в колектор,
      # якого нема. Список у воркфлоу не оновлюється разом із manifests,
      # тож міг розійтися знову вже наступного разу.
      - name: Wait rollouts
        run: |
          for d in $(kubectl -n cyberops get deployments -o name); do
            echo "=== rollout: $d"
            kubectl -n cyberops rollout status "$d" --timeout=240s
          done

      # Не просто «процеси піднялися». Старий крок робив один curl /health, тож
      # E2E був зелений на стенді, де UI не міг ані увійти, ані отримати
      # жодного запиту. Тут перевіряється поведінка, зокрема дві речі, які
      # curl не бачить у принципі:
      #   * runtime-конфіг — адреса API приходить у браузер, а не з бандлу;
      #   * CORS — запит із заголовком Origin, тобо так, як його робить браузер.
      #   * спостережуваність — таргети Prometheus up, спани прибули в Jaeger,
      #     датасорс Grafana здоровий (до v1.16 ніхто цього не перевіряв, і
      #     через це жив баг з недоступним jaeger:14269 у Service).
      - name: Smoke test (via gateway)
        run: |
          kubectl -n cyberops port-forward svc/gateway 8000:8000 &
          GW_PID=$!
          kubectl -n cyberops port-forward svc/frontend 3000:3000 &
          FE_PID=$!
          kubectl -n cyberops port-forward svc/prometheus 9090:9090 &
          PROM_PID=$!
          kubectl -n cyberops port-forward svc/jaeger-ui 16686:16686 &
          JAEGER_PID=$!
          kubectl -n cyberops port-forward svc/grafana 3001:3000 &
          GRAFANA_PID=$!
          trap 'kill $GW_PID $FE_PID $PROM_PID $JAEGER_PID $GRAFANA_PID 2>/dev/null || true' EXIT
          sleep 3

          # Очікувані значення беремо з самої розгорнутої лози, а не з
          # констант тут: інакше тест підтверджував би себе самого і був би
          # зелений рівно тоді, коли змінна не доїде до контейнера.
          secret_get() { kubectl -n cyberops get secret cyberops-secrets -o jsonpath="{.data.$1}" | base64 -d; }
          FRONTEND_ORIGIN=$(kubectl -n cyberops get svc frontend -o jsonpath='{.spec.ports[0].nodePort}')

          export GATEWAY_URL=http://localhost:8000
          export FRONTEND_URL=http://localhost:3000
          export EXPECTED_API_URL="$(kubectl -n cyberops get configmap cyberops-config -o jsonpath='{.data.API_PUBLIC_URL}')"
          export EXPECTED_ORIGIN="http://localhost:$FRONTEND_ORIGIN"
          export ADMIN_USER="$(secret_get ADMIN_USERNAME)"
          export ADMIN_PASS="$(secret_get ADMIN_PASSWORD)"
          export PROMETHEUS_URL=http://localhost:9090
          export JAEGER_URL=http://localhost:16686
          export GRAFANA_URL=http://localhost:3001
          export GRAFANA_USER=admin
          export GRAFANA_PASS="$(secret_get GRAFANA_ADMIN_PASSWORD)"
          # Якщо трасування вимкнено, перевіряти спани безглуздо, і мовчазно
          # пропустити їх не можна — тоді б тест знову був зелений на стенді
          # без спостережуваності. Замість цього падаємо з поясненням.
          TRACING_ON=$(kubectl -n cyberops get configmap cyberops-config -o jsonpath='{.data.TRACING_ENABLED}')
          if [ "$TRACING_ON" != "true" ]; then
            echo "::error::TRACING_ENABLED=$TRACING_ON, а перевірка спанів обов'язкова"
            exit 1
          fi
          # Усі чотири сервіси справді проходять запитами вище: gateway -> core
          # і auth — на HTTP-запитах, а worker — коли smoke ставить скан і
          # чекає на його завершення. Саме тому worker тут: без скану в smoke
          # його спан не створюється, і найдовша операція системи (nmap до
          # 300 с) не перевірялася б жодним стендом.
          #
          # Імена НЕ хардкодимо: Jaeger групує спани за Resource.service.name,
          # тобто за TRACING_SERVICE_NAME. Хардкод був би тим самим класом,
          # що APP_ENV=production у v1.13: перевірка зелена рівно тоді, коли
          # сервіс перейменовано, і мовчить про справжню причину. Тому беремо
          # значення з розгорнутого Deployment.
          #
          # Окремо падаємо, якщо змінної немає: тоді сервіс тихо пише спани
          # під дефолтом "core" з config.py, і Jaeger зливає його з реальним
          # core — дві різні послуги виглядають як одна, а перевірка мовчить.
          TRACE_SERVICES=""
          for svc in gateway core auth worker; do
            name=$(kubectl -n cyberops get "deploy/$svc" \
              -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="TRACING_SERVICE_NAME")].value}')
            if [ -z "$name" ]; then
              echo "::error::deploy/$svc не оголошує TRACING_SERVICE_NAME — спани підуть під дефолтом 'core' і злипнуться з ним у Jaeger"
              exit 1
            fi
            TRACE_SERVICES="$TRACE_SERVICES $name"
          done
          export EXPECTED_TRACE_SERVICES="${TRACE_SERVICES# }"
          echo "очікувані сервіси в Jaeger (з розгорнутого Deployment): $EXPECTED_TRACE_SERVICES"
          bash scripts/smoke.sh

      - name: Pods
        if: always()
        run: kubectl -n cyberops get pods -o wide

      # Діагностика падінь. Без неї крок вище показує лише симптом
      # (ImagePullBackOff / CrashLoopBackOff) і не пояснює його: логи контейнера
      # живуть у кластері, а не в лозі запуску, тож наступна сесія знову
      # вгадує причину. Крок коштує нічого — кластер уже видалено після нього.
      - name: Diagnostics
        if: always()
        run: |
          echo "=== events ==="
          kubectl -n cyberops get events --sort-by=.lastTimestamp | tail -40
          echo
          for p in $(kubectl -n cyberops get pods -o name); do
            echo "=== $p: describe ==="
            kubectl -n cyberops describe "$p" | sed -n '/^Events:/,$p'
            echo "=== $p: logs (previous) ==="
            kubectl -n cyberops logs "$p" --previous --tail=60 2>&1 || true
            echo "=== $p: logs (current) ==="
            kubectl -n cyberops logs "$p" --tail=40 2>&1 || true
            echo
          done