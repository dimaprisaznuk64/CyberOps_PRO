apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
            # Admin-порт: саме тут Jaeger віддає /metrics для Prometheus.
            # Без цього порту в Service таргет cyberops-jaeger скрейпив
            # неіснуючий порт і лишався DOWN — тихо, бо ніхто не дивився
            # у статус таргетів (до v1.16 їх не перевіряв ніхто).
            - name: admin
              containerPort: 14269
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  # nodePort можливий лише для NodePort. Без цього рядка Service лишається
  # ClusterIP (дефолт), і apiserver відхиляє маніфест цілком:
  # "spec.ports[1].nodePort: Forbidden: may not be used when `type` is
  # 'ClusterIP'" — тобто не застосується навіть решта Service.
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30086
    # Prometheus ходить на 14269 (admin /metrics). Service мусить його
    # експортувати: Prometheus скрейпить Service-адресу, а не Pod IP, тож
    # неоголошений порт недоступний, і таргет лишається DOWN.
    - name: admin
      port: 14269
      targetPort: 14269
