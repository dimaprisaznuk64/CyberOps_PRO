apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: cyberops/cyberops-worker
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cyberops-config
          ports:
            - containerPort: 9091
              name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector:
    app: worker
  ports:
    - port: 9091
      targetPort: 9091
      name: metrics