apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: cyberops/cyberops-worker
          imagePullPolicy: IfNotPresent
          # Jaeger групує спани за service.name
          env:
            - name: TRACING_SERVICE_NAME
              value: worker
          envFrom:
            - configMapRef:
                name: cyberops-config
            # секрети потрібні воркеру: саме він доставляє email/telegram
            - secretRef:
                name: cyberops-secrets
          ports:
            - containerPort: 9091
              name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector:
    app: worker
  ports:
    - port: 9091
      targetPort: 9091
      name: metrics