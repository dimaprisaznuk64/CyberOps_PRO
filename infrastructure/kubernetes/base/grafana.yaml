apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000
          volumeMounts:
            # Розділені на три підключення саме через обмеження ключів
            # ConfigMap: там не може бути "/". Раніше все лежало в одному
            # ConfigMap з ключами виду "datasources/datasource.yaml", і
            # kubectl apply відхиляв увесь маніфест. subPath монтує потрібний
            # ключ у потрібний каталог provisioning.
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards/cyberops.json
              subPath: cyberops.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
      volumes:
        # Один ConfigMap на каталог: ключі без "/", кожен монтується через
        # subPath у потрібне місце (див. volumeMounts).
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300