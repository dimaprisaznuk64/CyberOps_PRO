apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: cyberops/cyberops-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # Jaeger групує спани за service.name. Gateway єдиний сервіс, який
          # не оголошував TRACING_SERVICE_NAME й покладався на дефолт
          # "gateway" з gateway/config.py — збіг із іменем Deployment, а не
          # намір. Той самий клас, що APP_ENV=production у v1.13: поки що
          # виглядало правильно, бо значення збігалося.
          env:
            - name: TRACING_SERVICE_NAME
              value: gateway
          envFrom:
            - configMapRef:
                name: cyberops-config
            - secretRef:
                name: cyberops-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          # Liveness не має залежати від core/auth (див. /health/live у
          # gateway/main.py). Readiness лишається на /health — там 503, поки
          # внизу не відповідають, і це правильно: трафік не відправляємо.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080