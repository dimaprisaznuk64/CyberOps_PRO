apiVersion: v1
kind: ConfigMap
metadata:
  name: cyberops-config
data:
  APP_ENV: prod
  # DATABASE_URL і CORS_ORIGINS перенесені в cyberops-secrets. Перший містить
  # пароль (ConfigMap для цього не призначений), другий — середовищний
  # параметр, який не має бути у базовому манифесті зі значенням "*".
  CELERY_BROKER_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  EVENTS_ENABLED: "true"
  REALTIME_MODE: redis
  SCAN_ALLOW_PUBLIC: "false"
  NMAP_TIMEOUT_SECONDS: "300"
  # Прибирання завислих сканів (celery beat у воркері)
  SCAN_STALE_AFTER_SECONDS: "900"
  SCAN_REAPER_INTERVAL_SECONDS: "60"
  # Ліміт сирого Nmap-XML у JSON-відповіді архіву (понад — лише .xml)
  SCAN_RAW_XML_MAX_CHARS: "400000"
  # Публічна адреса gateway, яку бачить браузер. Читається контейнером
  # frontend у рантаймі (/runtime-config.js), а НЕ вшивається в бандл під
  # час next build: один і той самий образ має працювати на будь-якій
  # адресі, інакше UI на стенді з EIP ходив би в localhost браузера.
  # Значення нижче — для локального kind-стенда, де gateway видно на
  # NodePort 30080. Прод-оверлей мусить перекрити його (див. CORS_ORIGINS).
  API_PUBLIC_URL: http://localhost:30080
  # CORS_ORIGINS — у cyberops-secrets (див. коментар вище)
  AUTH_SERVICE_URL: http://auth:8002
  CORE_SERVICE_URL: http://core:8001
  # Rate limiting gateway. Лічильник у пам'яті, тому replicas: 1 — інакше
  # кожен под ділить N лімітів. Для масштабування потрібен спільний бекенд.
  RATE_LIMIT_ENABLED: "true"
  AUTH_RATE_LIMIT_PER_MINUTE: "5"
  API_RATE_LIMIT_PER_MINUTE: "120"
  SECURITY_HEADERS_ENABLED: "true"
  HSTS_ENABLED: "true"
  WORKER_METRICS_PORT: "9091"
  # Tracing: OTLP-колектор — сервіс jaeger у цьому ж namespace
  TRACING_ENABLED: "true"
  OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  # Канали сповіщень. SMTP_PASSWORD / TELEGRAM_BOT_TOKEN — у cyberops-secrets
  NOTIFICATIONS_ENABLED: "true"
  NOTIFY_MIN_SEVERITY: high
  APP_BASE_URL: http://localhost:3000
  SMTP_ENABLED: "false"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_FROM: cyberops@localhost
  SMTP_FROM_NAME: CyberOps PRO
  SMTP_STARTTLS: "true"
  SMTP_SSL: "false"
  TELEGRAM_ENABLED: "false"
  TELEGRAM_CHAT_ID: ""
  TELEGRAM_API_BASE: https://api.telegram.org