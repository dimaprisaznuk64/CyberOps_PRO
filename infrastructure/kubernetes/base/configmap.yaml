apiVersion: v1
kind: ConfigMap
metadata:
  name: cyberops-config
data:
  APP_ENV: prod
  # NOTE: DATABASE_URL містить dev-пароль для простоти демо. У продакшені
  # збирайте URL з секретів (or use a cloud DB engine).
  DATABASE_URL: postgresql+asyncpg://cyberops:cyberops@postgres:5432/cyberops
  CELERY_BROKER_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  EVENTS_ENABLED: "true"
  REALTIME_MODE: redis
  SCAN_ALLOW_PUBLIC: "false"
  NMAP_TIMEOUT_SECONDS: "300"
  CORS_ORIGINS: "*"
  AUTH_SERVICE_URL: http://auth:8002
  CORE_SERVICE_URL: http://core:8001
  WORKER_METRICS_PORT: "9091"
  # Канали сповіщень. SMTP_PASSWORD / TELEGRAM_BOT_TOKEN — у cyberops-secrets
  NOTIFICATIONS_ENABLED: "true"
  NOTIFY_MIN_SEVERITY: high
  APP_BASE_URL: http://localhost:3000
  SMTP_ENABLED: "false"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_FROM: cyberops@localhost
  SMTP_FROM_NAME: CyberOps PRO
  SMTP_STARTTLS: "true"
  SMTP_SSL: "false"
  TELEGRAM_ENABLED: "false"
  TELEGRAM_CHAT_ID: ""
  TELEGRAM_API_BASE: https://api.telegram.org