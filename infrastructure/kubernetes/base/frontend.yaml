---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: cyberops/cyberops-frontend
          # Образ без тега = :latest, для якого kubelet за замовчуванням
          # ставить imagePullPolicy: Always — тобто він іде в registry за
          # образом, якого там немає, і падає в ImagePullBackOff. Решта
          # наших деплойів (core/auth/worker/gateway/migrations) мають
          # IfNotPresent явно; локально образ завантажується в kind через
          # `kind load`, тож тягнути ззовні нічого.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # Один конкретний ключ, а не увесь envFrom: фронтенду не потрібні
          # SCAN_ALLOW_PUBLIC, NMAP_TIMEOUT чи URL сервісів, і краще щоб це
          # було видно в маніфесті, а не приїхало з конфігом «про всяк випадок».
          env:
            - name: API_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: cyberops-config
                  key: API_PUBLIC_URL
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30010