# НЕ для продакшену. Значення тут — заглушки для локального стенду, і сам
# факт їх наявності в Git означає, що це не справжні секрети. Для продакшену
# підключіть зовнішній менеджер (AWS Secrets Manager, Vault, External Secrets,
# Sealed Secrets) і не зберігайте значення в репозиторії.
apiVersion: v1
kind: Secret
metadata:
  name: cyberops-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: cyberops
  RABBITMQ_DEFAULT_PASS: guest
  # >= 32 байт (HS256 вимагає), і водночас лишається у списку шаблонних у
  # backend/app/config.py — тож production-режим із цим Secret відмовиться
  # стартувати. Раніше тут було 27 байт, і Job migrations падав у
  # ValidationError ще до Alembic.
  JWT_SECRET: dev-only-insecure-secret-change-me-1234567890
  # URL бази даних. Містить пароль, тому в Secret, а не в ConfigMap:
  # ConfigMap — не шифрований і видно в `kubectl get configmap -o yaml`.
  DATABASE_URL: postgresql+asyncpg://cyberops:cyberops@postgres:5432/cyberops
  # Дозволені origin для CORS. У базовому манифесті НЕ "*": для продакшену
  # задайте конкретний origin (або взагалі приберіть ключ — тоді жоден
  # origin не буде дозволений). Значення нижче — для локального стенду;
  # overlay має перекривати його своїм значенням.
  #
  # Обидва порти навмисно: 3000 — compose, 30010 — NodePort frontend у k8s.
  # Раніше тут був лише :3000, тож на kind-стенді UI з :30010 не проходив
  # CORS — тобто кожен запит браузера блокувався. Smoke-тест цього не бачив,
  # бо curl не надсилає заголовок Origin.
  CORS_ORIGINS: http://localhost:3000,http://localhost:30010
  # Сівач адміна (app/services/seed.py). Цих ключів тут не було, тож admin
  # існував лише на дефолтах у config.py — невидимо для маніфестів, і E2E
  # не мав звідки взяти облікові дані для перевірки входу.
  # ADMIN_PASSWORD="admin" — у списку PLACEHOLDER_PASSWORDS, тому
  # APP_ENV=production із цим Secret не стартує.
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: admin
  # Канали сповіщень — порожні за замовчуванням, щоб канали лишались вимкненими
  SMTP_PASSWORD: ""
  TELEGRAM_BOT_TOKEN: ""
