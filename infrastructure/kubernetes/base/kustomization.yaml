apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cyberops

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - rabbitmq.yaml
  - migrations.yaml
  - core.yaml
  - auth.yaml
  - gateway.yaml
  - worker.yaml
  - frontend.yaml
  - prometheus.yaml
  - jaeger.yaml
  - grafana.yaml

configMapGenerator:
  # Ключі ConfigMap не можуть містити "/", тому кожен каталог provisioning
  # — окремий ConfigMap, а поділка робиться через subPath у grafana.yaml.
  # Варіант "grafana-provisioning" з ключами datasources/datasource.yaml
  # збирався kustomize, але kubectl apply відхиляв увесь маніфест.
  - name: grafana-datasources
    options:
      disableNameSuffixHash: true
    files:
      - datasource.yaml=grafana/datasource.yaml
  - name: grafana-dashboards-provider
    options:
      disableNameSuffixHash: true
    files:
      - dashboards.yaml=grafana/dashboards.yaml
  - name: grafana-dashboards
    options:
      disableNameSuffixHash: true
    files:
      - cyberops.json=grafana/cyberops.json
