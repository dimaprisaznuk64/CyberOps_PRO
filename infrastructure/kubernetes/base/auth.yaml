apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: cyberops/cyberops-backend
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.auth_app:app", "--host", "0.0.0.0", "--port", "8002"]
          # Jaeger групує спани за service.name
          env:
            - name: TRACING_SERVICE_NAME
              value: auth
          envFrom:
            - configMapRef:
                name: cyberops-config
            - secretRef:
                name: cyberops-secrets
          ports:
            - containerPort: 8002
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - port: 8002
      targetPort: 8002