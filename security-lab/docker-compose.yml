# НАВМИСНО ВРАЗЛИВІ сервіси. Тільки локальна практика (127.0.0.1), не для щось real.
name: cyberops-lab

services:
  vulnerable-api:
    build: ./vulnerable-api
    image: cyberops/lab-vulnerable-api:latest
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      LAB_DATABASE_URL: "host=test-db port=5432 dbname=labdb user=lab password=lab123"
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - lab
      - cyberops

  vulnerable-web:
    build: ./vulnerable-web
    image: cyberops/lab-vulnerable-web:latest
    ports:
      - "127.0.0.1:8101:8001"
    networks:
      - lab
      - cyberops

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab123
      POSTGRES_DB: labdb
    volumes:
      - ./test-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d labdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab
      - cyberops

networks:
  lab:
  cyberops:
    external: true
    name: cyberops_default